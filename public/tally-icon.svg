<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#254B43"/>
      <stop offset="100%" stop-color="#16302A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="42" fill="url(#bgGrad)"/>

  <!-- four tally strokes -->
  <rect x="54" y="52" width="12" height="96" rx="6" fill="#D9A441"/>
  <rect x="80" y="52" width="12" height="96" rx="6" fill="#D9A441"/>
  <rect x="106" y="52" width="12" height="96" rx="6" fill="#D9A441"/>
  <rect x="132" y="52" width="12" height="96" rx="6" fill="#D9A441"/>

  <!-- fifth stroke crossing the set, the classic tally-of-five -->
  <rect x="48" y="94" width="104" height="12" rx="6" fill="#B4483A" transform="rotate(-32 100 100)"/>
</svg>
